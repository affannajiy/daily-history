name: Daily History Email

on:
  schedule:
    # 20:30 UTC = 04:30 MYT. Fires 3h early to compensate for GitHub free-tier
    # runner queue lag (~2-3h), targeting delivery by ~07:30 MYT.
    - cron: '30 20 * * *'
  workflow_dispatch: # Allow manual trigger for testing

# The job commits the archive page and the sent-event log to `gh-pages`.
# `contents: write` is the narrowest grant that still allows that push; there is
# no per-step scope in Actions, so the source checkout below drops the token
# instead — only the `site/` checkout needs to authenticate anything.
permissions:
  contents: write

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, not by tag. A tag is mutable: whoever
      # controls the action can repoint `v5` at new code, and that code runs in
      # a job holding every secret this workflow has. Renovate the pin
      # deliberately; do not loosen it back to a tag.
      #
      # `persist-credentials: false`: this checkout is only ever read from, so
      # it does not need the push token sitting in `.git/config` while `npm
      # start` parses untrusted feed and model responses. The `site/` checkout
      # below keeps its credentials, because it is the one that pushes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The published archive and the sent log live on an orphan `gh-pages`
      # branch, checked out beside the source rather than inside it. Keeping
      # them off `main` means a clone of this repo never carries a year of
      # generated HTML, and the bot's daily commit never collides with local
      # work. `fetch-depth: 0` is not needed — only the tip is ever appended to.
      - name: Check out the archive branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # Known CVEs are a supply-chain problem, not a code-review one: nothing
      # else in this pipeline would notice one. Production dependencies only —
      # `sharp` and `tsx` are dev tooling and never run in `npm start`, so an
      # advisory there must not block the morning's digest.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - run: npm run build

      # Offline and deterministic. Subject-page selection fails silently — a
      # wrong-subject card still renders perfectly — so this runs before any
      # mail goes out.
      - name: Check subject-page ranking
        run: npm run test:ranking

      - run: npm start
        env:
          # Write the edition and the sent log into the gh-pages checkout, not
          # into the source tree. Both must move together: the archive index and
          # the sent log are the two pieces of state a run carries forward.
          ARCHIVE_DIR: site
          SENT_LOG_PATH: site/data/sent.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # Optional: set a verified sender, e.g. "History Today <news@yourdomain.com>"
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}

      # The backstop. `npm start` mails its own failure alert with the actual
      # error in it and leaves `alert-sent` behind; this step covers the crashes
      # that happen before it can — a failed build, a missing secret, a ranking
      # regression. No error detail is available here, only the run link.
      - name: Report a failure npm start could not report
        if: failure() && hashFiles('alert-sent') == ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$RESEND_API_KEY" ] && [ -n "$RECIPIENT_EMAIL" ] || exit 0
          DATE=$(TZ=Asia/Kuala_Lumpur date "+%B %-d, %Y")
          # No job log is quoted: it is not secret-masked in a file the way the
          # Actions UI masks it on screen, and this mail leaves that protection.
          jq -n --arg from "${FROM_EMAIL:-History Today <onboarding@resend.dev>}"                 --arg to "$RECIPIENT_EMAIL"                 --arg subject "FAILED: History Today — $DATE (before send)"                 --arg text "The workflow failed before the digest could report anything itself, so there is no error text here — the build, the ranking test or a secret is the likely cause.

          Run log: $RUN_URL

          Nothing was archived and no event was marked as used."                 '{from:$from,to:$to,subject:$subject,text:$text}'           | curl -sS -X POST https://api.resend.com/emails               -H "Authorization: Bearer $RESEND_API_KEY"               -H "Content-Type: application/json"               --data @- > /dev/null

      # Runs even if the send failed, so a digest that was generated and
      # archived is still readable at its URL. `npm start` only writes the sent
      # log after a successful send, so nothing is wrongly marked as used.
      - name: Commit archive and sent log
        if: always()
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Archive digest for $(TZ=Asia/Kuala_Lumpur date +%F)"
          git push origin gh-pages
