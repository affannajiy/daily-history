name: Daily History Email

on:
  schedule:
    # 20:30 UTC = 04:30 MYT. Fires 3h early to compensate for GitHub free-tier
    # runner queue lag (~2-3h), targeting delivery by ~07:30 MYT.
    - cron: '30 20 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm start
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # Optional: set a verified sender, e.g. "History Today <news@yourdomain.com>"
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
